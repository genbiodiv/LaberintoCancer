<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El laberinto del cáncer</title>
    <meta
      name="description"
      content="Simulador interactivo en 3D de biología molecular, evolución clonal y oncología clínica: recorre el laberinto del cáncer como célula tumoral o como oncólogo."
    />
    <meta property="og:title" content="El laberinto del cáncer" />
    <meta
      property="og:description"
      content="Simulador interactivo en 3D de biología molecular, evolución clonal y oncología clínica: recorre el laberinto del cáncer como célula tumoral o como oncólogo."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var p = new URLSearchParams(window.location.search).get('theme');
          var t = p === 'dark' || p === 'light' ? p : localStorage.getItem('el_laberinto_theme_v1');
          if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            t = 'dark';
          }
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.dataset.theme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.dataset.theme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#0b1220] dark:text-slate-100 antialiased selection:bg-sky-100 selection:text-sky-900 dark:selection:bg-sky-900/60 dark:selection:text-sky-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
